name: Live Verified Probability Freeze

on:
  workflow_dispatch:
    inputs:
      game_date:
        description: "MLB slate date (YYYY-MM-DD)"
        required: true
        type: string
      game_pk:
        description: "Canonical MLB gamePk"
        required: true
        type: string
      manifest_path:
        description: "Repo path to verified manifest JSON"
        required: true
        default: "live_verified_manifest.json"
        type: string

jobs:
  freeze:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest

      - name: Run tests
        run: pytest -q

      - name: Validate manifest path exists
        run: test -f "${{ inputs.manifest_path }}"

      - name: Build verified market-blind probability freeze
        run: |
          python live_verified_probability.py \
            --date "${{ inputs.game_date }}" \
            --game-pk "${{ inputs.game_pk }}" \
            --manifest-json "${{ inputs.manifest_path }}"

      - name: Upload probability freeze artifact
        uses: actions/upload-artifact@v5
        with:
          name: live-probability-freeze-${{ inputs.game_pk }}
          path: live_probability_freeze.json
          if-no-files-found: error
