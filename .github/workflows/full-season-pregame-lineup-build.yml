name: Full Season Pregame Lineup Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run tests
        run: pytest -q
      - name: Build full-season certified pregame lineups
        run: python run_full_season_pregame_lineup_build.py
      - name: Upload lineup artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: full-season-pregame-lineups
          if-no-files-found: warn
          path: |
            pregame_lineup_snapshots_raw.jsonl
            pregame_lineup_snapshot_build_report.json
