name: Context Availability Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: pytest -q

      - name: Run 2025 context availability audit
        run: python run_context_availability_audit.py

      - name: Show availability report
        if: always()
        run: |
          if [ -f context_availability_report.json ]; then
            cat context_availability_report.json
          else
            echo "context_availability_report.json was not created"
          fi

      - name: Upload context audit artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: context-availability-audit
          if-no-files-found: warn
          path: |
            context_availability_report.json
            context_availability_audit.json
