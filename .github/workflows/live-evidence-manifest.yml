name: Live Evidence Manifest

on:
  workflow_dispatch:
    inputs:
      game_date:
        description: "MLB slate date (YYYY-MM-DD)"
        required: true
        type: string
      game_pk:
        description: "Canonical MLB gamePk"
        required: true
        type: string
      secondary_starter_path:
        description: "Optional repo path to secondary starter confirmation JSON"
        required: false
        default: ""
        type: string

jobs:
  evidence:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest

      - name: Run tests
        run: pytest -q

      - name: Build auditable live evidence manifest
        shell: bash
        run: |
          if [ -n "${{ inputs.secondary_starter_path }}" ]; then
            test -f "${{ inputs.secondary_starter_path }}"
            python live_manifest_generator.py \
              --date "${{ inputs.game_date }}" \
              --game-pk "${{ inputs.game_pk }}" \
              --secondary-starter-json "${{ inputs.secondary_starter_path }}"
          else
            python live_manifest_generator.py \
              --date "${{ inputs.game_date }}" \
              --game-pk "${{ inputs.game_pk }}"
          fi

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v5
        with:
          name: live-evidence-${{ inputs.game_pk }}
          path: |
            live_evidence_report.json
            live_verified_manifest.draft.json
            live_verified_manifest.json
          if-no-files-found: warn
