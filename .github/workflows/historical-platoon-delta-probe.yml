name: Historical Platoon Delta Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run tests
        run: pytest -q
      - name: Verify raw lineup file exists
        run: test -s pregame_lineup_snapshots_raw.jsonl
      - name: Probe platoon delta derivation
        run: python run_historical_platoon_probe.py
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: historical-platoon-delta-probe
          if-no-files-found: warn
          path: historical_platoon_delta_probe.json
