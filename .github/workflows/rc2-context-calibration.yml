name: RC2 Context Calibration
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip pandas numpy pytest
      - run: pytest -q
      - run: python run_rc2_context_calibration.py
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rc2-context-calibration
          if-no-files-found: warn
          path: |
            rc2_context_calibration_report.json
            context_coefficients_rc2_fitted.json
