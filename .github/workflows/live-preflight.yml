name: Live Preflight

on:
  workflow_dispatch:
    inputs:
      game_date:
        description: "MLB slate date (YYYY-MM-DD)"
        required: true
        type: string

jobs:
  preflight:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest

      - name: Run tests
        run: pytest -q

      - name: Fetch live MLB slate and build preflight
        run: python live_preflight.py --date "${{ inputs.game_date }}"

      - name: Upload live preflight artifact
        uses: actions/upload-artifact@v5
        with:
          name: live-preflight-${{ inputs.game_date }}
          path: live_preflight_report.json
          if-no-files-found: error
