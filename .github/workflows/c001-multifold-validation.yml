name: C001 Multi-Fold Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest

      - name: Run tests
        run: pytest -q

      - name: Run C001 chronological multi-fold validation
        run: python run_c001_multifold_validation.py

      - name: Upload C001 multi-fold report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: c001-multifold-validation
          path: c001_multifold_validation_report.json
          if-no-files-found: error
