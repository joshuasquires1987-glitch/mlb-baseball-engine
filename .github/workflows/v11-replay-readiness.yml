name: v1.1 Replay Readiness Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest

      - name: Run tests
        run: pytest -q

      - name: Run v1.1 replay readiness audit
        run: python v11_replay_readiness.py

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: v11-replay-readiness
          if-no-files-found: warn
          path: v11_replay_readiness_report.json
