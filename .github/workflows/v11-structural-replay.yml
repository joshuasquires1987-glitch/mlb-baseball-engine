name: V1.1 Structural Replay

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest

      - name: Run tests
        run: pytest -q

      - name: Run structural-default v1.1 replay
        run: python run_v11_structural_default_replay.py

      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: v11-structural-default-replay
          path: |
            v11_structural_default_probability_ledger.jsonl
            v11_structural_default_replay_report.json
          if-no-files-found: warn
