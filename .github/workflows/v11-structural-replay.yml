name: V1.1 Structural Replay

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest

      - name: Run tests
        run: pytest -q

      - name: Run structural-default v1.1 replay
        run: python run_v11_structural_default_replay.py

      - name: Run v1.1 structural benchmark
        run: python run_v11_structural_benchmark.py

      - name: Run benchmark diagnostics
        run: python run_v11_structural_diagnostics.py

      - name: Run C001 prior-season home-baseline challenger
        run: python run_c001_prior_season_home_baseline.py

      - name: Upload replay, benchmark, diagnostics, and challenger artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: v11-structural-default-replay
          path: |
            v11_structural_default_probability_ledger.jsonl
            v11_structural_default_replay_report.json
            v11_structural_default_scored_games.jsonl
            v11_structural_default_benchmark_report.json
            v11_structural_default_calibration.csv
            v11_structural_default_subgroups.csv
            v11_structural_default_diagnostic_report.json
            v11_structural_default_diagnostic_groups.csv
            c001_prior_season_home_baseline_report.json
            c001_prior_season_home_baseline_scored_games.jsonl
          if-no-files-found: warn
