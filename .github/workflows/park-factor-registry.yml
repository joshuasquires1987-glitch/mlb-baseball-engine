name: Point In Time Park Factor Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pytest

      - name: Run tests
        run: pytest -q

      - name: Build point-in-time park factor registry
        run: python run_park_factor_registry_build.py

      - name: Show build summary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("park_factor_registry.json"))
          print("records",len(x["records"]))
          print("skipped",len(x["skipped"]))
          PY

      - name: Upload registry artifact
        uses: actions/upload-artifact@v5
        with:
          name: point-in-time-park-factor-registry
          if-no-files-found: error
          path: park_factor_registry.json
